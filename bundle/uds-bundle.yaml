kind: UDSBundle
metadata:
  name: greenbone-community
  description: Greenbone Community Edition test bundle
  version: dev

packages:
  # PostgreSQL (pg-gvm) database, deployed first so the greenbone-db-credentials
  # Secret exists before gvmd starts. Same namespace as the app, so the app's
  # IntraNamespace network policy already permits gvmd -> postgres.
  - name: greenbone-db
    path: ../db
    ref: dev-upstream

  - name: greenbone-community
    path: ../
    ref: dev
    overrides:
        greenbone-community:
          greenbone:
            values:
              - path: feeds.secInfo
                value: false
    # ref: 24.10-uds.0

  # REST API wrapper for gvmd's GMP protocol, deployed last so the
  # greenbone-community-gvmd Service and admin Secret already exist.
  - name: openvas-api
    path: ../openvas-api
    ref: dev
