apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: {{ .Values.package.name }}
  namespace: {{ .Values.package.namespace }}
spec:
  network:
    serviceMesh:
      mode: ambient
    expose:
      - description: Greenbone Security Assistant
        service: {{ .Values.network.expose.service }}
        selector:
          app.kubernetes.io/name: greenbone
          app.kubernetes.io/instance: greenbone-community
        gateway: {{ .Values.network.expose.gateway }}
        host: {{ .Values.network.expose.host }}
        port: {{ .Values.network.expose.port }}
        targetPort: {{ .Values.network.expose.targetPort }}
      {{- if .Values.network.openvasApi.expose.enabled }}
      - description: OpenVAS REST API
        service: openvas-api
        selector:
          app.kubernetes.io/name: openvas-api
          app.kubernetes.io/instance: openvas-api
        gateway: {{ .Values.network.openvasApi.expose.gateway }}
        host: {{ .Values.network.openvasApi.expose.host }}
        port: 80
        targetPort: 80
      {{- end }}
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace
      - direction: Egress
        remoteGenerated: IntraNamespace
      {{- if .Values.network.allowScannerEgress }}
      - direction: Egress
        remoteGenerated: Anywhere
        description: Allow Greenbone scanner traffic to configured scan targets
      {{- end }}
      {{- if .Values.network.defectdojoUpload.allowEgress }}
      # Scoped to the scheduled scan -> DefectDojo upload CronJob only. Harmless if
      # the CronJob is disabled (no pod carries this component label to match).
      - direction: Egress
        remoteGenerated: Anywhere
        description: Allow the DefectDojo upload CronJob to reach DefectDojo
        selector:
          app.kubernetes.io/component: defectdojo-upload
      {{- end }}
