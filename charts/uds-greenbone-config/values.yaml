package:
  name: greenbone-community
  namespace: greenbone

network:
  expose:
    host: greenbone
    gateway: tenant
    service: greenbone-community
    port: 9392
    targetPort: 9392
  openvasApi:
    expose:
      enabled: true
      gateway: tenant
      host: openvas-api
  allowScannerEgress: false
  # Egress allow for the scheduled DefectDojo upload CronJob (greenbone chart's
  # `defectdojo.enabled`). Scoped to that pod via component label; enabled by
  # default since it only takes effect when the CronJob pod exists.
  defectdojoUpload:
    allowEgress: true

exemptions:
  enabled: true
  namespace: uds-policy-exemptions
  podName: greenbone-community-0
