{{- /*
Initial Greenbone Security Assistant admin credentials.

The gvmd image's start-gvmd runs `gvmd --create-user=$USER --password=$PASSWORD`
on first boot, defaulting to admin/admin. We instead inject these from a Secret so
the deployment gets a unique password rather than a well-known default exposed
through the UDS ingress.

Password precedence:
  1. .Values.admin.password, if set explicitly.
  2. the password already stored in this Secret (preserved across helm upgrades
     via lookup, so it stays stable).
  3. a freshly generated random password on first install.

Note: start-gvmd only *creates* the admin on first boot (`|| true` on subsequent
runs), so changing this value later does not rotate the live password -- use
gvmd's `--new-password` workflow for rotation.
*/}}
{{- $secretName := printf "%s-admin" (include "greenbone.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.admin.password -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "greenbone.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.admin.user | quote }}
  password: {{ $password | quote }}
