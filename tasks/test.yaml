  - name: all
    actions:
      - task: health-check
      # - task: custom-resource-test
      - task: ingress
      #- task: ui
      - task: api-scan

  # Ensure application deploys successfully and becomes available
  - name: health-check
    actions:
      - description: Greenbone Community Health Check
        wait:
          cluster:
            kind: Pod
            name: greenbone-community-0
            namespace: greenbone
            condition: Ready

