{{- /*
DB credentials shared (same namespace) with the Greenbone app package, which reads
this Secret for gvmd's PGPASSWORD. Password precedence:
  1. .Values.postgres.password if set explicitly.
  2. the password already in this Secret (preserved across upgrades via lookup).
  3. a freshly generated random password on first install.
*/}}
{{- $name := .Values.credentialsSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.postgres.password -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "greenbone-db.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.user | quote }}
  database: {{ .Values.postgres.database | quote }}
  password: {{ $password | quote }}
