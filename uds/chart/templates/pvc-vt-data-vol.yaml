apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: vt-data-vol
    namespace: greenbone-community-edition
    labels:
        app.kubernetes.io/name: vt-data-vol
        app.kubernetes.io/part-of: greenbone-community-edition
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
