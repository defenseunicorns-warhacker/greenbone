# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: greenbone-community
  description: Greenbone Community Edition for UDS
  version: dev

components:
  - name: greenbone-community
    required: true
    only:
      flavor: upstream
    import:
      path: common
    images:
      - registry.community.greenbone.net/community/vulnerability-tests:latest
      - registry.community.greenbone.net/community/notus-data:latest
      - registry.community.greenbone.net/community/scap-data:latest
      - registry.community.greenbone.net/community/cert-bund-data:latest
      - registry.community.greenbone.net/community/dfn-cert-data:latest
      - registry.community.greenbone.net/community/data-objects:latest
      - registry.community.greenbone.net/community/report-formats:latest
      - registry.community.greenbone.net/community/gpg-data:latest
      - registry.community.greenbone.net/community/redis-server:latest
      - registry.community.greenbone.net/community/pg-gvm:stable
      - registry.community.greenbone.net/community/pg-gvm-migrator:stable
      - registry.community.greenbone.net/community/gvmd:stable
      - registry.community.greenbone.net/community/gsa:stable-slim
      - registry.community.greenbone.net/community/gsad:stable
      - registry.community.greenbone.net/community/openvas-scanner:stable
      - registry.community.greenbone.net/community/ospd-openvas:stable
