apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvas-api.fullname" . }}
  labels:
    {{- include "openvas-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openvas-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openvas-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "openvas-api.fullname" . }}
      containers:
        - name: openvas-api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          env:
            - name: GVM_HOST
              value: {{ .Values.gvm.host | quote }}
            - name: GVM_PORT
              value: {{ .Values.gvm.port | quote }}
            - name: GVM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gvm.adminSecretName }}
                  key: username
            - name: GVM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gvm.adminSecretName }}
                  key: password
          ports:
            - name: api
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /docs
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /docs
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
