    tag: latest
  dataObjects:
    repository: data-objects
    tag: latest
  reportFormats:
    repository: report-formats
    tag: latest
  gpgData:
    repository: gpg-data
    tag: latest
  redisServer:
    repository: redis-server
    tag: latest
  pgGvm:
    repository: pg-gvm
    tag: stable
  pgGvmMigrator:
